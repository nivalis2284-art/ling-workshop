[project]
name = "lingnexus"
version = "0.1.1"
description = "Owner-controlled long-lived personal AI system"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8,<3", "httpx>=0.28,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "openpyxl>=3.1,<4", "Pillow>=11,<14", "python-multipart>=0.0.18,<1", "playwright>=1.50,<2", "pystray>=0.19,<1", "tzdata>=2025.1,<2027"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lingnexus = ["storage/migrations/*.sql", "desktop/assets/*.png"]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
    "httpx2>=2.13,<3",
    "pyinstaller>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
